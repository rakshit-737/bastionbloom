[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "bastionbloom"
version = "0.1.0"
description = "Local-first security scanning that connects secrets and deployment risks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "rakshit-737" }]
dependencies = [
  "typer>=0.16,<1",
  "rich>=13.9,<15",
  "PyYAML>=6.0.2,<7",
  "Jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
bastionbloom = "bastionbloom.cli:app"

[project.urls]
Repository = "https://github.com/rakshit-737/bastionbloom"
Issues = "https://github.com/rakshit-737/bastionbloom/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bastionbloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/bastionbloom/cli.py" = ["B008"]
