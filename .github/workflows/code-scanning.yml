name: BastionBloom Code Scanning
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bastionbloom:
    name: Upload BastionBloom SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install BastionBloom
        run: python -m pip install .
      - name: Scan repository configuration
        run: bastionbloom --no-banner scan . --format sarif --output bastionbloom.sarif --fail-on none
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: bastionbloom.sarif
          category: bastionbloom-static-analysis
