name: BastionBloom Code Scanning
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bastionbloom:
    name: Upload BastionBloom SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install BastionBloom
        run: python -m pip install .
      - name: Scan repository configuration
        run: bastionbloom --no-banner scan . --format sarif --output bastionbloom.sarif --fail-on none
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: bastionbloom.sarif
          category: bastionbloom-static-analysis
